name: Release

# Every push to main that changes more than docs builds the app and publishes a release.
# The version is <major>.<minor> from tauri.conf.json plus the run number, so it always increases,
# which is what the in-app updater compares.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        run: |
          base=$(jq -r .version src-tauri/tauri.conf.json | cut -d. -f1,2)
          echo "VERSION=${base}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Update artifacts need the signing key, which the Nix build doesn't have, so they are
          # switched on here and not in tauri.conf.json.
          TAURI_CONFIG: '{"version":"${{ env.VERSION }}","bundle":{"createUpdaterArtifacts":true}}'
        with:
          tagName: v${{ env.VERSION }}
          releaseName: Rook ${{ env.VERSION }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles appimage,deb
